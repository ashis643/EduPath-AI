<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Student Account — EduPath AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top right, #1e1b4b 0%, #090d16 60%);
            padding: 2rem 0;
        }
        .auth-card {
            width: 100%;
            max-width: 520px;
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2.5rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <div style="font-size: 2.5rem;">🎓</div>
            <h2 style="font-size: 1.5rem; font-weight: 800;">Student Registration</h2>
            <p style="color: var(--text-muted); font-size: 0.88rem;">Create your academic profile to receive personalized recommendations</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        <span>{{ message }}</span>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="e.g. Jordan Smith" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="jordan@university.edu" required>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Degree</label>
                    <select name="degree" class="form-select">
                        <option value="B.Tech CSE">B.Tech CSE</option>
                        <option value="B.S. Data Science">B.S. Data Science</option>
                        <option value="B.C.A. IT">B.C.A. IT</option>
                        <option value="M.Tech AI">M.Tech AI</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Branch / Specialization</label>
                    <input type="text" name="branch" class="form-control" value="Computer Science" required>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Current Semester</label>
                    <input type="number" name="semester" class="form-control" min="1" max="8" value="5" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Current CGPA / %</label>
                    <input type="number" name="cgpa" class="form-control" step="0.1" min="0" max="10" value="8.4" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Target Career Goal</label>
                <select name="target_career_id" class="form-select">
                    {% for role in career_roles %}
                        <option value="{{ role.id }}">{{ role.title }} ({{ role.category }})</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">Create Account & Build Profile</button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: var(--text-muted);">
            Already registered? <a href="{{ url_for('login') }}">Sign In</a>
        </div>
    </div>

</body>
</html>
